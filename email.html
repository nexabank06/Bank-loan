<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .container {
      background: rgba(24, 26, 38, 0.97);
      border-radius: 18px;
      box-shadow: 0 8px 32px 0 rgba(124,58,237,0.18), 0 2px 8px rgba(2,6,23,0.12);
      padding: 2.5em 2em 2em 2em;
      max-width: 400px;
      width: 100%;
      margin: 2em auto;
      animation: fadeInUp 1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f3f4f6;
    }
    @keyframes fadeInUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    h2 {
      text-align: center;
      color: #7c3aed;
      margin-bottom: 1.5em;
      letter-spacing: 1px;
      font-weight: 700;
    }
    form label {
      display: block;
      margin-bottom: 0.3em;
      color: #c7d2fe;
      font-weight: 500;
    }
    form input, form textarea {
      width: 100%;
      padding: 0.7em;
      margin-bottom: 1.2em;
      border: 1px solid #7c3aed;
      border-radius: 8px;
      background: #23263a;
      color: #f3f4f6;
      font-size: 1em;
      transition: border 0.2s, background 0.2s;
    }
    form input:focus, form textarea:focus {
      border: 1.5px solid #38bdf8;
      outline: none;
      background: #181a26;
      color: #fff;
    }
    button[type="submit"] {
      width: 100%;
      padding: 0.8em;
      background: linear-gradient(90deg, #7c3aed 0%, #38bdf8 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(124,58,237,0.10);
      transition: background 0.3s, transform 0.2s;
      letter-spacing: 0.5px;
    }
    button[type="submit"]:hover {
      background: linear-gradient(90deg, #38bdf8 0%, #7c3aed 100%);
      transform: translateY(-2px) scale(1.03);
    }
    #responseMsg {
      margin-top: 1em;
      text-align: center;
      font-size: 1em;
      min-height: 1.5em;
      color: #38bdf8;
      opacity: 0;
      transition: opacity 0.5s, color 0.3s;
    }
    #responseMsg.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Contact Support</h2>
    <form id="emailForm">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="subject">Subject:</label>
      <input type="text" id="subject" name="subject" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send</button>
    </form>
    <div id="responseMsg"></div>
  </div>
  <script>
    const responseMsg = document.getElementById('responseMsg');
    document.getElementById('emailForm').onsubmit = async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        name: form.name.value,
        email: form.email.value,
        subject: form.subject.value,
        message: form.message.value
      };
      responseMsg.textContent = 'Sending...';
      responseMsg.classList.add('visible');
      try {
        const res = await fetch('/api/email/support', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          responseMsg.textContent = 'Your message has been sent!';
          responseMsg.style.color = '#2ecc71';
          form.reset();
        } else {
          responseMsg.textContent = result.error || 'Failed to send message.';
          responseMsg.style.color = '#f76d6d';
        }
      } catch (err) {
        responseMsg.textContent = 'An error occurred.';
        responseMsg.style.color = '#f76d6d';
      }
      responseMsg.classList.add('visible');
      setTimeout(() => responseMsg.classList.remove('visible'), 3500);
    };
  </script>
</body>
</html>
